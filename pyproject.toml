[project]
name = "direct-vs-programmatic-tool-calling"
version = "0.1.0"
description = "Direct vs Programmatic Tool Calling benchmark examples"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.0.0",
    "openai-agents>=0.4.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.0.0",
    "jupyterlab>=4.0.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ptc_benchmark", "src/ptc_trace_demo"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

